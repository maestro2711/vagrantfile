---
# tasks file for reverse-proxy
- name: Copy Nginx configuration to /etc/nginx/conf.d
  template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    
    mode: '0644'

- name: Restart Nginx to apply configuration
  service:
    name: nginx
    state: restarted
    enabled: true

