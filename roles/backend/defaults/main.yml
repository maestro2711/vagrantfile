---
# defaults file for backend
# roles/backend/defaults/main.yml

mongodb_host: 192.168.10.13           # IP de la VM database
mongodb_port: 27017
mongodb_db: imcdb

mongo_root_username: devops
mongo_root_password: ansible

backend_container_name: backend
backend_image: cantona084/imc-ms:1.0.49
backend_internal_port: 8080
backend_external_port: 8080

proxy_host: 192.168.10.12     # ou 192.168.10.12
proxy_port: 80

# The values below are set in vault.yml
# mongo_root_username: ...
# mongo_root_password: ...
# Note: Ensure that the mongo_root_username and mongo_root_password are set in vault.yml
# to match the credentials used in the database service.
# This is crucial for the backend to connect to the MongoDB service correctly.