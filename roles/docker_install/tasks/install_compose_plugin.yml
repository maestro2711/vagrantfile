- name: Install required packages for APT over HTTPS
  apt:
    name:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker official APT repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker engine and Compose plugin
  apt:
    name:
    - docker.io
    - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: true

- name: Verify docker compose is available
  command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0

- name: Show docker compose version
  debug:
    msg: "Docker Compose version: {{ compose_version.stdout }}"
