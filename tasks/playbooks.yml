---
- name: information to the vms collected
  hosts: all
  become: yes
  vars:
    role: "user"
  tasks:
    - name: Gather facts about the system
      ansible.builtin.debug:
        msg: "System facts: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: variables content
      ansible.builtin.debug:
        msg: "System facts: {{ role }} {{ inventory_hostname }}"

    - name: be sure that the directory exist
      ansible.builtin.file:
        path: /opt/startup
        state: directory
        mode: '0755'

    - name: copy file to the hosts
      ansible.builtin.copy:
        src: demo.txt
        dest: /opt/startup/demo.txt
        mode: '0600'

    - name: install htop package
      package:
        name: htop
        state: present

    - name: Install curl
      #become: true
      ansible.builtin.apt:
           name: curl
           state: present
           update_cache: yes
      #when: inventory_hostname in groups['webservers']
      #when: inventory_hostname in groups['webservers'] or inventory_hostname in groups['dbservers']
      when: inventory_hostname == "vm-databases"

    - name: create user
      ansible.builtin.user:
        name: backup
        state: present
        shell: /bin/bash
      when: inventory_hostname == "vm-databases"
        

    - name: copy an template
      ansible.builtin.template:
         src: willkommen.txt.j2 # tmplate
         dest: /tmp
         mode: 0600